apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: accounts-cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        test -n "$SOURCE_PATH"
        test "$SOURCE_PATH" != /
        rm -rf -- "$SOURCE_PATH"/* "$SOURCE_PATH"/.[!.]* "$SOURCE_PATH"/..?*
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: accounts-flake8
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m venv /tmp/accounts-lint
        . /tmp/accounts-lint/bin/activate
        pip install flake8==6.1.0
        flake8 service --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 service --count --max-complexity=10 --max-line-length=127 --statistics
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: accounts-nose
spec:
  workspaces:
    - name: source
  steps:
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: "sqlite://"
        - name: FORCE_HTTPS
          value: "false"
      script: |
        #!/bin/sh
        set -eu
        python -m venv /tmp/accounts-test
        . /tmp/accounts-test/bin/activate
        pip install -r requirements.txt
        nosetests --with-spec --spec-color --with-coverage --cover-package=service --cover-min-percentage=95
